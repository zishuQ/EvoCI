[project]
name = "evoci"
version = "0.7.0"
description = "A durable, self-improving multi-agent runtime for CI failure recovery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "EvoCI contributors" }]
dependencies = [
  "aiosqlite>=0.22,<1",
  "langchain-core>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2.2",
  "pyyaml>=6,<7",
  "rich>=14,<15",
  "typer>=0.21,<1",
]

[project.scripts]
evoci = "evoci.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  ".env.example",
  ".gitignore",
  "README.md",
  "benchmarks",
  "docs",
  "pyproject.toml",
  "src",
  "tests",
  "uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["pytest-of-root"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["evoci"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true
